{% extends 'mylist/base.html' %}

{% block title %}Error - To-Do List{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
    <div style="font-size: 4rem; margin-bottom: 16px;">😕</div>
    
    <h2 style="font-size: 1.5rem; margin-bottom: 16px;">Something went wrong</h2>
    
    <p style="color: var(--text-muted); margin-bottom: 24px;">
        {{ error_message|default:"An unexpected error occurred. Please try again." }}
    </p>

    <a href="{% url 'task_list' %}" class="btn btn-primary">Back to Task List</a>
</div>
{% endblock %}
